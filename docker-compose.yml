services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      # A first boot builds the data directory before mariadbd listens at all,
      # and until it does every probe fails in about 70ms. Failures outside a
      # start period count towards retries, so the budget used to be retries
      # times interval — 30 x 5s = 150s — and a runner with a busy disk hit it
      # at 151s, reported the container permanently unhealthy, and failed the
      # job before a test ran. Failures inside start_period neither count nor
      # mark the container unhealthy, so a boot now has 180s of grace and 60s
      # of counted retries after it. Health is reported the moment a probe
      # passes, so an ordinary boot is no slower for the longer grace.
      start_period: 180s
      interval: 5s
      # The probe connects and asks InnoDB whether it has finished starting:
      # 70ms on an idle machine, but a probe killed for running over counts
      # exactly like a refused connection, and the runs this has to survive are
      # the ones where the disk is the bottleneck.
      timeout: 10s
      retries: 12
    restart: unless-stopped

  wordpress:
    image: wordpress:${WP_IMAGE_TAG:-php8.3-apache}
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        if ( ! defined( 'WP_DEBUG_LOG' ) ) { define('WP_DEBUG_LOG', true); }
        if ( ! defined( 'WP_DEBUG_DISPLAY' ) ) { define('WP_DEBUG_DISPLAY', false); }
        if ( ! defined( 'SCRIPT_DEBUG' ) ) { define('SCRIPT_DEBUG', false); }
        if ( ! defined( 'PC_HARNESS_ROOT' ) ) { define('PC_HARNESS_ROOT', '/opt/pc-harness'); }
    volumes:
      - wp_data:/var/www/html
      - ${PLUGIN_PATH:?PLUGIN_PATH is required}:/var/www/html/wp-content/plugins/${PLUGIN_SLUG:?PLUGIN_SLUG is required}
      - ./tests:/opt/pc-harness/tests:ro
      - ./scripts:/opt/pc-harness/scripts:ro
      - ./docker/php.ini:/usr/local/etc/php/conf.d/pc-harness.ini:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  wpcli:
    image: wordpress:${WPCLI_IMAGE_TAG:-cli-php8.3}
    user: "33:33"
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      PLUGIN_SLUG: ${PLUGIN_SLUG:-}
      EXTRA_PLUGIN_SLUG: ${EXTRA_PLUGIN_SLUG:-}
      HPOS_MODE: ${HPOS_MODE:-enabled}
      PC_HARNESS_ROOT: /opt/pc-harness
    volumes:
      - wp_data:/var/www/html
      - ${PLUGIN_PATH:?PLUGIN_PATH is required}:/var/www/html/wp-content/plugins/${PLUGIN_SLUG:?PLUGIN_SLUG is required}
      - ./tests:/opt/pc-harness/tests:ro
      - ./scripts:/opt/pc-harness/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    entrypoint: ["wp", "--allow-root", "--path=/var/www/html"]
    restart: "no"

volumes:
  db_data:
  wp_data:
